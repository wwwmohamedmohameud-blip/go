<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeSnap Pro - استخراج صور يوتيوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 text-gray-100 min-h-screen p-6">
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [url, setUrl] = useState('');
            const [videoId, setVideoId] = useState(null);
            const [error, setError] = useState(null);

            const fetchThumbnails = () => {
                const match = url.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
                if (match && match[1]) {
                    setVideoId(match[1]);
                    setError(null);
                } else {
                    setError('الرجاء إدخال رابط يوتيوب صحيح');
                    setVideoId(null);
                }
            };

            const qualities = [
                { name: 'الدقة العالية جداً (Max Resolution)', id: 'maxresdefault' },
                { name: 'الدقة القياسية (Standard Definition)', id: 'sddefault' },
                { name: 'عالية الجودة (High Quality)', id: 'hqdefault' },
                { name: 'متوسطة الجودة (Medium Quality)', id: 'mqdefault' },
                { name: 'الدقة الافتراضية (Default)', id: 'default' }
            ];

            return (
                <div className="max-w-3xl mx-auto">
                    {/* Header with Logo */}
                    <header className="flex items-center justify-between bg-gray-800 border border-gray-700 p-4 rounded-2xl shadow-lg mb-8">
                        <div className="flex items-center gap-3">
                            <div className="bg-red-600 p-2.5 rounded-xl text-white shadow-md flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold text-white tracking-wide">TubeSnap <span className="text-red-500">Pro</span></h1>
                                <p className="text-xs text-gray-400">أداة احترافية لاستخراج صور يوتيوب</p>
                            </div>
                        </div>
                        <div className="text-xs bg-gray-700 text-gray-300 px-3 py-1.5 rounded-full border border-gray-600">
                            يُعمل محلياً بدون خوادم أو GitHub
                        </div>
                    </header>

                    {/* Main Card */}
                    <div className="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-xl">
                        <label className="block text-sm font-semibold mb-2 text-gray-300">أدخل رابط فيديو يوتيوب:</label>
                        <div className="flex gap-2 mb-4">
                            <input
                                type="text"
                                value={url}
                                onChange={(e) => setUrl(e.target.value)}
                                placeholder="https://www.youtube.com/watch?v=..."
                                className="flex-grow p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:outline-none focus:border-red-500 transition"
                            />
                            <button
                                onClick={fetchThumbnails}
                                className="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-xl transition shadow-lg flex items-center gap-2"
                            >
                                استخراج
                            </button>
                        </div>
                        {error && <p className="text-red-400 text-sm mb-4 bg-red-950/50 border border-red-800 p-3 rounded-xl">{error}</p>}
                    </div>

                    {/* Results */}
                    {videoId && (
                        <div className="mt-8 grid gap-6">
                            <h2 className="text-lg font-bold text-gray-200 border-b border-gray-700 pb-2">الصور المتاحة بجميع الدقات:</h2>
                            {qualities.map((q) => {
                                const imgUrl = `https://img.youtube.com/vi/${videoId}/${q.id}.jpg`;
                                return (
                                    <div key={q.id} className="bg-gray-800 border border-gray-700 p-4 rounded-2xl shadow-lg flex flex-col md:flex-row gap-4 items-center">
                                        <div className="w-full md:w-1/3 bg-gray-900 rounded-xl overflow-hidden border border-gray-700">
                                            <img
                                                src={imgUrl}
                                                alt={q.name}
                                                className="w-full h-36 object-cover"
                                            />
                                        </div>
                                        <div className="flex-grow w-full">
                                            <h3 className="font-semibold text-white mb-1">{q.name}</h3>
                                            <p className="text-xs text-gray-400 mb-4 break-all">{imgUrl}</p>
                                            <div className="flex flex-wrap gap-3">
                                                <a
                                                    href={imgUrl}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="bg-gray-700 hover:bg-gray-600 text-white text-sm px-4 py-2 rounded-xl transition flex items-center gap-2"
                                                >
                                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                                    </svg>
                                                    فتح الصورة
                                                </a>
                                                <a
                                                    href={imgUrl}
                                                    download={`youtube-thumbnail-${videoId}-${q.id}.jpg`}
                                                    target="_blank"
                                                    rel="noopener noreferrer"
                                                    className="bg-red-600 hover:bg-red-700 text-white text-sm px-4 py-2 rounded-xl transition flex items-center gap-2"
                                                >
                                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                    </svg>
                                                    تحميل الصورة
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
